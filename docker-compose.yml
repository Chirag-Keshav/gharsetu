# Optional local infrastructure (SPEC §5). The default dev setup needs none of this: `pnpm db:start`
# runs an embedded PostgreSQL, storage is the local disk and jobs run in-process. Use these services
# to exercise the production adapters: S3-compatible storage (MinIO), BullMQ (Redis) and ClamAV.
#
#   docker compose up -d postgres redis minio minio-init      # then set the .env values shown below
#   docker compose --profile scan up -d clamav
#
# Credentials here are local-development defaults only; never reuse them anywhere else.
name: propcare

services:
  postgres:
    # Same port and credentials as the embedded database, so .env works with either (run one, not both).
    image: postgres:16.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: propcare
    ports: ['54329:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  redis:
    # QUEUE_DRIVER=bullmq  REDIS_URL=redis://localhost:6379
    image: redis:7.4.2
    ports: ['6379:6379']

  minio:
    # STORAGE_DRIVER=s3  S3_ENDPOINT=http://localhost:9000  S3_REGION=ap-south-1  S3_FORCE_PATH_STYLE=true
    # S3_ACCESS_KEY_ID=minio  S3_SECRET_ACCESS_KEY=minio-dev-secret
    # S3_PRIVATE_BUCKET=propcare-private  S3_PUBLIC_BUCKET=propcare-public
    # PUBLIC_MEDIA_BASE_URL=http://localhost:9000/propcare-public
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-dev-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

  minio-init:
    # Creates the private bucket (signed URLs only) and the public-read bucket for published-listing photos.
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio-dev-secret; do sleep 1; done;
      mc mb -p local/propcare-private local/propcare-public;
      mc anonymous set download local/propcare-public;
      exit 0;"

  clamav:
    # MALWARE_SCANNER=clamav (adapter slot; the MVP ships the no-op scanner, see docs/DECISIONS.md)
    profiles: [scan]
    image: clamav/clamav:1.4.2
    ports: ['3310:3310']

volumes:
  pgdata:
  miniodata:
